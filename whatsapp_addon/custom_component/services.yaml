send_message:
  name: Send message
  description: Send a Whatsapp message
  fields:
    clientId:
      name: Client ID
      required: true
      example: default
    to:
      name: Target JID
      required: true
      example: 391234567890@s.whatsapp.net
    body:
      name: Body
      required: true
      advanced: true
      example:
        text: Hello!

# -------------------------
# NEW MEDIA SERVICES
# -------------------------

send_image:
  name: Send image
  description: Send an image from a remote URL or Home Assistant local media path
  fields:
    clientId:
      required: true
      example: default
    to:
      required: true
      example: 120363171536423506@g.us
    body:
      required: true
      advanced: true
      example:
        url: "/media/example.jpg"
        caption: "Hello"
        mimeType: "image/jpeg"

send_video:
  name: Send video
  description: Send a video from a remote URL or Home Assistant local media path
  fields:
    clientId:
      required: true
      example: default
    to:
      required: true
      example: 120363171536423506@g.us
    body:
      required: true
      advanced: true
      example:
        url: "/media/example.mp4"
        caption: "Hello"
        mimeType: "video/mp4"

send_document:
  name: Send document
  description: Send a document from a remote URL or Home Assistant local media path
  fields:
    clientId:
      required: true
      example: default
    to:
      required: true
      example: 120363171536423506@g.us
    body:
      required: true
      advanced: true
      example:
        url: "/media/file.pdf"
        fileName: "file.pdf"
        caption: "FYI"
        mimeType: "application/pdf"

send_audio:
  name: Send audio
  description: Send audio from a remote URL or Home Assistant local media path (set ptt=true for a voice note)
  fields:
    clientId:
      required: true
      example: default
    to:
      required: true
      example: 120363171536423506@g.us
    body:
      required: true
      advanced: true
      example:
        url: "/media/example.ogg"
        ptt: true
        mimeType: "audio/ogg"
